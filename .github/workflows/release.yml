name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches VERSION file
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(cat VERSION)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "Tag ($TAG_VERSION) does not match VERSION file ($FILE_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt
          pip3 install py2app

      - name: Build .app
        run: python3 setup.py py2app

      - name: Ad-hoc code sign
        run: codesign --force --deep --sign - "dist/MTCleanMac.app"

      - name: Zip app bundle
        run: |
          cd dist
          zip -r "MTCleanMac-${GITHUB_REF_NAME:-dev}.zip" MTCleanMac.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTCleanMac-app
          path: dist/MTCleanMac-*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MTCleanMac-*.zip
          generate_release_notes: true
